quarkus.application.name=portal
quarkus.http.port=9001

# Health and other non-application endpoints live on a port that is not published
# outside the cluster, like in every module.
quarkus.management.enabled=true
quarkus.management.port=9101

# ---------------------------------------------------------------- IAM (one per environment)
quarkus.oidc.auth-server-url=${PLATFORM_IAM_ISSUER:http://localhost:8080/realms/platform}
quarkus.oidc.client-id=portal
quarkus.oidc.credentials.secret=${PORTAL_OIDC_SECRET:portal-secret}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=profile,email
# Fixed callback path so the Vite dev server can proxy exactly this one path.
quarkus.oidc.authentication.redirect-path=/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# The IAM clients require PKCE for the authorization code flow.
quarkus.oidc.authentication.pkce-required=true
# Cookie names must differ per module: cookies ignore ports, and in production the
# modules may share a domain.
quarkus.oidc.authentication.cookie-suffix=portal
# Zero Trust: the access token is verified on every request, not just the ID token.
quarkus.oidc.authentication.verify-access-token=true
quarkus.oidc.token.audience=portal
# Roles come from the userinfo endpoint, cached so not every call hits the IAM.
quarkus.oidc.authentication.user-info-required=true
quarkus.oidc.roles.source=userinfo
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.allow-user-info-cache=true
quarkus.oidc.token-cache.max-size=1000
quarkus.oidc.token-cache.time-to-live=5M

# Tokens live encrypted in the cookie, so the container stays stateless (E2).
# The secret MUST be identical across replicas, otherwise users are logged out at random.
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.token-state-manager.encryption-secret=${PORTAL_COOKIE_SECRET:portal-dev-cookie-secret-change-me-32b}

quarkus.oidc.logout.path=/oidc-logout
quarkus.oidc.logout.post-logout-path=/
# Back-channel logout: the IAM tells this module directly that the session ended — no
# matter which module ended it. Without it the cookie here would stay valid until it
# expires, even though the IAM session is long gone (E8).
quarkus.oidc.logout.backchannel.path=/back-channel-logout

# ---------------------------------------------------------------- access rules
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# The IAM calls this one without a session — it is the caller, not the user. The request
# still proves itself: the logout token is verified against the IAM's signing keys.
quarkus.http.auth.permission.backchannel.paths=/back-channel-logout
quarkus.http.auth.permission.backchannel.methods=POST
quarkus.http.auth.permission.backchannel.policy=permit

# ---------------------------------------------------------------- cross-origin requests
# A module answers its own frontend and nothing else. That is also what protects the
# state-changing endpoints: a form on a foreign site cannot read the response, and
# anything beyond a simple request is stopped by the preflight before it is handled.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${PORTAL_ALLOWED_ORIGINS:http://localhost:9001,http://localhost:5173}
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=content-type
quarkus.http.cors.access-control-allow-credentials=true

# ---------------------------------------------------------------- platform

# ---------------------------------------------------------------- launcher tiles
portal.apps[0].id=demo
portal.apps[0].name=Demo
portal.apps[0].description=Mandantenbezogene Datensätze prüfen und Änderungen beantragen
portal.apps[0].url=${PORTAL_APP_DEMO_URL:http://localhost:9002}
portal.apps[0].icon=table
