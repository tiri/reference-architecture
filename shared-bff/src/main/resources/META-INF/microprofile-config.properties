# Defaults shipped with the library. A module inherits them by depending on it and
# normally configures nothing; anything set in a module's own configuration wins, which
# keeps a test or staging environment able to deviate without a library release.

# ---------------------------------------------------------------- the tenant catalogue
# The fixed list of tenants, with display name and order, in ONE place for the whole
# platform. It carries no permissions: who may act in which tenant is decided solely by
# the mandant_<id> roles in the token. Adding a tenant is a release of this library, which
# is the point — every module then shows the same name in the same order.
platform.tenants=a:Tenant A,b:Tenant B

# ---------------------------------------------------------------- the delivered frontend
# Quarkus caches static resources for a day by default, and that includes index.html —
# the one file that must never be cached. Its asset names carry a content hash, so the
# browser keeps loading the previous frontend against the new backend after a release,
# and nothing looks broken until something quietly behaves as it did last week.
#
# Off for everything rather than only for the shell, because the setting has no
# per-path form. The hashed assets are the ones worth caching, and in production that
# belongs in front of the module anyway — an ingress or CDN can cache /assets/** forever,
# which is exactly what a content hash is for.
quarkus.http.static-resources.caching-enabled=false
