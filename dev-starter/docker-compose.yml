name: platform-dev

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-platform.json:/opt/keycloak/data/import/realm-platform.json:ro
    healthcheck:
      # curl is not in the image; TCP probe via bash built-in
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/platform HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12


  # ------------------------------------------------------------------- Datenbasis
  # The leading source of the records, and a foreign system: somebody else operates it, the
  # module only reads it and writes what an accepted change touches.
  #
  # Its own server, not another database on the module's own. Two databases on one server
  # cannot be joined either, but they share a version, a restart, a backup and a page cache
  # — so the sandbox would quietly be easier than the thing it stands for. Separate, the
  # boundary is real: it can be stopped on its own to see what the module does when the
  # leading source is unreachable.
  #
  # The module reaches it through an interface rather than through a driver, so a deployment
  # points the datasource at whatever it actually operates and changes no code. Filling it:
  # ./datenbasis/seed.sh [rows]
  datenbasis-db:
    image: postgres:17
    environment:
      # The operator of the foreign system owns this; the module's own login is created by
      # the init script with rights on the data and none on the schema.
      POSTGRES_DB: datenbasis
      POSTGRES_USER: datenbasis
      POSTGRES_PASSWORD: datenbasis
    ports:
      # 5435, not 5434: the unified-gateway variant of this platform uses that one, and
      # both are often up at the same time on the same machine.
      - "5435:5432"
    volumes:
      - datenbasis-db-data:/var/lib/postgresql/data
      - ./datenbasis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datenbasis -d datenbasis"]
      interval: 5s
      timeout: 3s
      retries: 12

  demo-db:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    volumes:
      - demo-db-data:/var/lib/postgresql/data
      # Creates the unprivileged application role; superusers would bypass RLS.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 12


volumes:
  demo-db-data:
  datenbasis-db-data:
