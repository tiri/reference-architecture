schemaVersion: 2.2.0
metadata:
  name: datenportal
  displayName: Datenportal — Plattform
  description: >-
    Cloud-Entwicklungsumgebung für die gesamte Plattform: beide geteilten Bibliotheken,
    das Portal, das Demo-Modul sowie IAM, Modul-Datenbank und die Datenbasis.
  version: 0.1.0
  language: Java
  projectType: Quarkus
  tags:
    - Quarkus
    - React
    - Keycloak
    - PostgreSQL

# Jede Anwendung und jede Bibliothek ist ein eigenes Repository (Bausteinsicht 5.2), also
# klont der Arbeitsbereich sie alle nebeneinander — genau wie lokal, wo `shared-ui` über
# einen npm-Arbeitsbereich (dev-starter/npm-workspace.sh) und `shared-bff` über das lokale
# Maven-Repository gefunden wird. Die Module fordern die Bibliothek unter ihrer Version an,
# nicht über einen Pfad: derselbe Eintrag trägt später auch gegen eine Registry.
#
# ANPASSEN: Die Remotes zeigen auf Platzhalter. Vor dem ersten Einsatz auf die echten
# Repository-Adressen und den gewünschten Zweig ändern.
projects:
  - name: shared-bff
    description: Geteilte Backend-Logik (Maven-Abhängigkeit)
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: https://example.org/datenportal/shared-bff.git
  - name: shared-ui
    description: Geteilte Frontend-Logik (npm-Abhängigkeit, TypeScript-Quelltext)
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: https://example.org/datenportal/shared-ui.git
  - name: portal-app
    description: Portal — Anwendungsübersicht
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: https://example.org/datenportal/portal-app.git
  - name: demo-app
    description: Demo-Modul — Datensätze, Änderungsanträge, Batch-Lauf
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: https://example.org/datenportal/demo-app.git
  - name: dev-starter
    description: Diese Entwicklungsumgebung (Realm, Datenbank-Initialisierung, Doku)
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: https://example.org/datenportal/dev-starter.git
  - name: arch-docs
    description: Architekturdokumentation (arc42) — das Zielbild
    git:
      checkoutFrom:
        revision: main
      remotes:
        origin: https://example.org/datenportal/arch-docs.git

components:
  # Alle Container eines Arbeitsbereichs teilen sich das Netzwerk. Deshalb erreichen die
  # Anwendungen IAM und Datenbanken unter localhost und den gewohnten Ports — die
  # Standardwerte aus den application.properties gelten unverändert.
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryRequest: 2Gi
      memoryLimit: 6Gi
      cpuRequest: 500m
      cpuLimit: "4"
      mountSources: true
      volumeMounts:
        - name: m2
          path: /home/user/.m2
        - name: npm-cache
          path: /home/user/.npm
      env:
        - name: MAVEN_OPTS
          value: -Xmx3g
      endpoints:
        - name: portal
          targetPort: 9001
          exposure: public
          protocol: https
        - name: demo
          targetPort: 9002
          exposure: public
          protocol: https
        - name: portal-vite
          targetPort: 5173
          exposure: public
          protocol: https
        - name: demo-vite
          targetPort: 5174
          exposure: public
          protocol: https
        # Nicht-Anwendungs-Endpunkte bleiben im Arbeitsbereich.
        - name: portal-management
          targetPort: 9101
          exposure: internal
        - name: demo-management
          targetPort: 9102
          exposure: internal

  - name: keycloak
    container:
      image: quay.io/keycloak/keycloak:26.5
      memoryLimit: 1Gi
      cpuLimit: "1"
      mountSources: true
      env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: admin
      # Der Realm liegt im geklonten dev-starter, nicht im Abbild. Die Back-Channel-Adresse
      # zeigt dort auf den Docker-Host, weil die Module lokal neben Compose laufen; hier
      # teilen sich alle Container ein Netzwerk, also ist es localhost.
      command: ["/bin/bash", "-c"]
      args:
        - >-
          mkdir -p /opt/keycloak/data/import &&
          sed 's|host.docker.internal|localhost|g'
          /projects/dev-starter/keycloak/realm-platform.json
          > /opt/keycloak/data/import/realm-platform.json &&
          /opt/keycloak/bin/kc.sh start-dev --import-realm
      endpoints:
        - name: keycloak
          targetPort: 8080
          exposure: public
          protocol: https

  - name: demo-db
    container:
      image: postgres:17
      memoryLimit: 512Mi
      mountSources: true
      env:
        - name: POSTGRES_DB
          value: demo
        - name: POSTGRES_USER
          value: demo
        - name: POSTGRES_PASSWORD
          value: demo
        # Wie lokal auf 5433, damit die Standardkonfiguration der Module passt.
        - name: PGPORT
          value: "5433"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      volumeMounts:
        - name: demo-db-data
          path: /var/lib/postgresql/data
      # Legt die unprivilegierte Anwendungsrolle an — ein Superuser würde die
      # zeilenbasierten Zugriffsregeln umgehen (Konzept 8.2).
      command: ["/bin/bash", "-c"]
      args:
        - >-
          cp /projects/dev-starter/postgres/init/*.sql /docker-entrypoint-initdb.d/ 2>/dev/null;
          exec docker-entrypoint.sh postgres

  # ---------------------------------------------------------------- Datenbasis
  # Die Datenbasis ist ein fremdbetriebenes System: die führende Quelle der Datensätze. Im
  # Arbeitsbereich ist sie ein eigener Postgres-Server neben dem des Moduls — nicht eine
  # zweite Datenbank auf demselben. Beides wäre nicht verbindbar, aber ein gemeinsamer Server
  # teilt Version, Neustart, Sicherung und Cache: die Spielwiese wäre stillschweigend
  # einfacher als das, wofür sie steht. Getrennt lässt sich die Grenze auch anfassen — dieser
  # Dienst kann einzeln gestoppt werden.
  #
  # Das Modul erreicht die Datensätze über eine Schnittstelle, nicht über einen Treiber: eine
  # Installation richtet die Datenquelle auf das, was sie tatsächlich betreibt.
  - name: datenbasis-db
    container:
      image: postgres:17
      memoryLimit: 512Mi
      mountSources: true
      env:
        # Der Eigentümer steht für den Betreiber des fremden Systems. Die Anmeldung des
        # Moduls legt das Init-Skript an — mit Rechten auf den Daten und keinen am Schema.
        - name: POSTGRES_DB
          value: datenbasis
        - name: POSTGRES_USER
          value: datenbasis
        - name: POSTGRES_PASSWORD
          value: datenbasis
        # Wie lokal auf 5435, damit die Standardkonfiguration der Module passt.
        - name: PGPORT
          value: "5435"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      volumeMounts:
        - name: datenbasis-db-data
          path: /var/lib/postgresql/data
      command: ["/bin/bash", "-c"]
      args:
        - >-
          cp /projects/dev-starter/datenbasis/init/*.sql /docker-entrypoint-initdb.d/ 2>/dev/null;
          exec docker-entrypoint.sh postgres


  - name: m2
    volume:
      size: 3Gi
  - name: npm-cache
    volume:
      size: 1Gi
  - name: demo-db-data
    volume:
      size: 1Gi
  - name: datenbasis-db-data
    volume:
      size: 2Gi

commands:
  # Reihenfolge wie lokal: erst die Bibliotheken, dann die Module.
  - id: install-shared-bff
    exec:
      label: "1 · shared-bff ins lokale Maven-Repository installieren"
      component: tools
      workingDir: ${PROJECTS_ROOT}/shared-bff
      commandLine: mvn -B install -DskipTests
      group:
        kind: build
        isDefault: true
  - id: install-frontends
    exec:
      # Ein Aufruf für alle Frontends: der Arbeitsbereich verlinkt die Bibliothek aus dem
      # Nachbar-Checkout und gibt allen Modulen dasselbe React — zwei Kopien von React auf
      # einer Seite sind kein doppeltes Paket, sondern ein defekter Hook.
      label: "2 · Frontends als npm-Arbeitsbereich installieren"
      component: tools
      workingDir: ${PROJECTS_ROOT}/dev-starter
      commandLine: ./npm-workspace.sh
      group:
        kind: build
  - id: seed-datenbasis
    exec:
      label: "3 · Datenbasis mit Saatdaten füllen"
      component: tools
      workingDir: ${PROJECTS_ROOT}/dev-starter
      commandLine: ./datenbasis/seed.sh
      group:
        kind: build
  - id: prepare
    composite:
      label: "Arbeitsbereich vorbereiten"
      commands:
        - install-shared-bff
        - install-frontends
      parallel: false

  - id: run-portal
    exec:
      label: "Portal starten (9001)"
      component: tools
      workingDir: ${PROJECTS_ROOT}/portal-app
      commandLine: mvn -B quarkus:dev
      group:
        kind: run
        isDefault: true
  - id: run-demo
    exec:
      label: "Demo-Modul starten (9002)"
      component: tools
      workingDir: ${PROJECTS_ROOT}/demo-app
      commandLine: mvn -B quarkus:dev
      group:
        kind: run
  - id: run-batch
    exec:
      label: "Batch-Lauf einmal ausführen"
      component: tools
      workingDir: ${PROJECTS_ROOT}/demo-app
      commandLine: >-
        mvn -B clean package -DskipTests &&
        java -Dquarkus.profile=batch -jar target/quarkus-app/quarkus-run.jar --batch
      group:
        kind: run
  - id: test-demo
    exec:
      label: "Tests des Demo-Moduls"
      component: tools
      workingDir: ${PROJECTS_ROOT}/demo-app
      commandLine: mvn -B test
      group:
        kind: test
        isDefault: true

events:
  postStart:
    - prepare
