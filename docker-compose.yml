services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8080"
      - "9000:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  domain-crm:
    build: ./domain-crm
    ports:
      - "8081:8081"
    environment:
      # Internal URL for JWKS fetch; issuer is localhost:8090 (Keycloak frontendUrl)
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/myapp
      OIDC_ISSUER_URI: http://localhost:8090/realms/myapp
    depends_on:
      keycloak:
        condition: service_started

  domain-billing:
    build: ./domain-billing
    ports:
      - "8082:8082"
    environment:
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/myapp
      OIDC_ISSUER_URI: http://localhost:8090/realms/myapp
    depends_on:
      keycloak:
        condition: service_started

  portal:
    build: ./portal
    ports:
      - "8080:8080"
    environment:
      # Server-to-server (token exchange, JWKS) — internal Docker network
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/myapp
      # JWT iss validation — must match Keycloak frontendUrl (localhost:8090)
      OIDC_ISSUER_URI: http://localhost:8090/realms/myapp
      # Browser-facing: the authorization and logout redirects the browser follows
      OIDC_AUTH_URI: http://localhost:8090/realms/myapp/protocol/openid-connect/auth
      OIDC_END_SESSION_URI: http://localhost:8090/realms/myapp/protocol/openid-connect/logout
      OIDC_CLIENT_ID: myapp-client
      OIDC_CLIENT_SECRET: dev-secret
      DOMAIN_CRM_URL: http://domain-crm:8081
      DOMAIN_BILLING_URL: http://domain-billing:8082
      TOKEN_ENCRYPTION_SECRET: "docker-dev-session-encryption-key-32c"
    depends_on:
      keycloak:
        condition: service_started
