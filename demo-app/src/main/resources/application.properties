quarkus.application.name=demo
quarkus.http.port=9002

# Health and other non-application endpoints on a port that is not published publicly.
quarkus.management.enabled=true
quarkus.management.port=9102

# ---------------------------------------------------------------- IAM (one per environment)
quarkus.oidc.auth-server-url=${PLATFORM_IAM_ISSUER:http://localhost:8080/realms/platform}
quarkus.oidc.client-id=demo
quarkus.oidc.credentials.secret=${DEMO_OIDC_SECRET:demo-secret}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.redirect-path=/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.cookie-suffix=demo
# Zero Trust: the access token is verified on every request, not just the ID token.
quarkus.oidc.authentication.verify-access-token=true
quarkus.oidc.token.audience=demo

# Roles come from the userinfo endpoint, so a revoked role takes effect without waiting
# for the token to expire. Cached, otherwise every API call would hit the IAM.
quarkus.oidc.authentication.user-info-required=true
quarkus.oidc.roles.source=userinfo
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.allow-user-info-cache=true
quarkus.oidc.token-cache.max-size=1000
quarkus.oidc.token-cache.time-to-live=5M

# Tokens live encrypted in the cookie, so the container stays stateless (E2).
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.token-state-manager.encryption-secret=${DEMO_COOKIE_SECRET:demo-dev-cookie-secret-change-me-32b}

quarkus.oidc.logout.path=/oidc-logout
quarkus.oidc.logout.post-logout-path=/
# Back-channel logout: the IAM tells this module directly that the session ended — no
# matter which module ended it. Without it the cookie here would stay valid until it
# expires, even though the IAM session is long gone (E8).
quarkus.oidc.logout.backchannel.path=/back-channel-logout

# ---------------------------------------------------------------- access rules
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# The IAM calls this one without a session — it is the caller, not the user. The request
# still proves itself: the logout token is verified against the IAM's signing keys.
quarkus.http.auth.permission.backchannel.paths=/back-channel-logout
quarkus.http.auth.permission.backchannel.methods=POST
quarkus.http.auth.permission.backchannel.policy=permit

# ---------------------------------------------------------------- cross-origin requests
# A module answers its own frontend and nothing else. That is also what protects the
# state-changing endpoints: a form on a foreign site cannot read the response, and
# anything beyond a simple request is stopped by the preflight before it is handled.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${DEMO_ALLOWED_ORIGINS:http://localhost:9002,http://localhost:5174}
# Every method the module actually answers. A verb missing here is refused before it
# reaches a resource — with a CORS error, which reads like a configuration problem on the
# other side rather than a list that was never updated.
quarkus.http.cors.methods=GET,POST,DELETE
quarkus.http.cors.headers=content-type
quarkus.http.cors.access-control-allow-credentials=true

# ---------------------------------------------------------------- platform
platform.portal-url=${PLATFORM_PORTAL_URL:http://localhost:9001}

# ---------------------------------------------------------------- own database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DEMO_DB_USER:demo_app}
quarkus.datasource.password=${DEMO_DB_PASSWORD:demo_app}
quarkus.datasource.jdbc.url=${DEMO_DB_URL:jdbc:postgresql://localhost:5433/demo}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true

# ---------------------------------------------------------------- Datenbasis (foreign system)
# The leading source of the records: its own database and its own read-only role, reached
# over its own connection as the module itself. Never migrated from here and never joined to
# the module's own tables — this module reads it and writes only what an accepted change
# touches.
#
# In development it is a PostgreSQL server of its own, beside the module's — not a second
# database on the module's server, so that stopping it is a thing that can be done. Nothing
# above this URL knows any of it: the module reaches the records through RecordCatalog, so a
# deployment points this at whatever it actually operates.
quarkus.datasource.datenbasis.db-kind=postgresql
quarkus.datasource.datenbasis.username=${DATENBASIS_DB_USER:datenbasis_reader}
quarkus.datasource.datenbasis.password=${DATENBASIS_DB_PASSWORD:datenbasis_reader}
quarkus.datasource.datenbasis.jdbc.url=${DATENBASIS_DB_URL:jdbc:postgresql://localhost:5435/datenbasis}
# Never enlisted in the module's transactions. It is a foreign system that happens to be
# reachable, not a second schema: a write to it is not undone by rolling back the module's
# own transaction, and the batch already carries that assumption — it records each request
# as applied or failed on its own. Enlisting it silently made the two one unit of work,
# and the batch then failed at commit and retried until its own guard stopped it.
quarkus.datasource.datenbasis.jdbc.transactions=disabled
# Excluded from readiness: the module's own database decides whether it can serve. A
# foreign system being unreachable is a degraded answer to a request, not a reason for an
# orchestrator to take this instance out of rotation and restart it.
quarkus.datasource.datenbasis.health-exclude=true
# Never migrated from here: another party owns that schema.
quarkus.flyway.datenbasis.migrate-at-start=false

# ---------------------------------------------------------------- mass operations
demo.batch.chunk-size=25

# Batch mode: the same artifact started with --batch does one pass and exits. Without a
# port it can run beside the web instance; in the cluster it is the same image, started
# with the other option by whatever schedules it.
# Port 0 = pick a free one. (quarkus.management.enabled is fixed at build time and
# cannot be switched off per profile, so the port is what gets moved out of the way.)
%batch.quarkus.http.port=0
%batch.quarkus.management.port=0
