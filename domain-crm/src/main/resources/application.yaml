quarkus:
  application:
    name: domain-crm
  banner:
    enabled: false

  oidc:
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8090/realms/myapp}
    discovery-enabled: false
    jwks-path: /protocol/openid-connect/certs
    application-type: service
    token:
      issuer: ${OIDC_ISSUER_URI:http://localhost:8090/realms/myapp}
      forced-jwk-refresh-interval: PT1H
    connection-delay: PT60S

  http:
    port: 8081
    auth:
      permission:
        public:
          # Health, info, and static JS bundles (remoteEntry.js, MF chunks) are public.
          # The portal's AssetGateway fetches bundles server-to-server without a token.
          paths: /q/health*,/q/info,/assets*
          policy: permit
        authenticated:
          # Everything else, including /api/*, requires a valid Bearer JWT.
          # This is enforced at the HTTP layer before JAX-RS annotations run.
          paths: /*
          policy: authenticated

  quinoa:
    ui-dir: src/main/webui
    build-dir: dist
    package-manager-install: false
    dev-server:
      port: 3001

  smallrye-health:
    ui:
      enable: false

  info:
    build:
      enabled: true
    git:
      enabled: false
    os:
      enabled: false
    java:
      enabled: false
